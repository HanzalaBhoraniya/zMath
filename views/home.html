<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zMath - The game which is not easy</title>
    <meta property="og:title" content="ZMath — Real-Time Multiplayer Arcade Math Game" />
    <meta property="og:description" content="Scan a QR code to turn your smartphone into a wireless haptic controller and race against friends on a shared PC screen." />
    <meta property="og:image" content="https://zmath.onrender.com/preview.png" />
    <meta property="og:url" content="https://zmath.onrender.com" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/home.css" />
    <link rel="stylesheet" href="/CSS/style.css" />
  </head>
  <body>
    <div id="heroSection">
      <h1 id="mainH1">ZMath</h1>
      <p id="description">
        Defend the mainframe. Solve equations before the blocks hit the firewall
      </p>
    </div>
    <div id="gameModeWrapper">
      <div class="gameModes" id="keyboard">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>

          <line x1="6" y1="9" x2="6.01" y2="9" stroke-width="2"></line>
          <line x1="10" y1="9" x2="10.01" y2="9" stroke-width="2"></line>
          <line x1="14" y1="9" x2="14.01" y2="9" stroke-width="2"></line>
          <line x1="18" y1="9" x2="18.01" y2="9" stroke-width="2"></line>

          <line x1="6" y1="12" x2="6.01" y2="12" stroke-width="2"></line>
          <line x1="10" y1="12" x2="10.01" y2="12" stroke-width="2"></line>
          <line x1="14" y1="12" x2="14.01" y2="12" stroke-width="2"></line>
          <line x1="18" y1="12" x2="18.01" y2="12" stroke-width="2"></line>

          <line x1="6" y1="15" x2="6.01" y2="15" stroke-width="2"></line>
          <line x1="10" y1="15" x2="14" y2="15"></line>
          <line x1="18" y1="15" x2="18.01" y2="15" stroke-width="2"></line>
        </svg>
        <div class="cardText">
          <h2>SINGLE PLAYER</h2>
          <p>Keyboard Gameplay</p>
        </div>
      </div>
      <div id="twoPlayers" class="gameModes multiplayer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="80"
          height="80"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>

          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <div class="multiplayerText cardText">
          <h2>2 PLAYERS</h2>
          <p>With two mobile phones</p>
        </div>
      </div>
      <div id="threePlayers" class="gameModes multiplayer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="80"
          height="80"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>

          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <div class="multiplayerText cardText">
          <h2>3 PLAYERS</h2>
          <p>With three mobile phones</p>
        </div>
      </div>
      <div id="fourPlayers" class="gameModes multiplayer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="80"
          height="80"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>

          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <div class="multiplayerText cardText">
          <h2>4 PLAYERS</h2>
          <p>With four mobile phones</p>
        </div>
      </div>
    </div>
    <script src="/JS/home.js"></script>
  </body>
</html>
